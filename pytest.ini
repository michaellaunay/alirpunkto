[pytest]
addopts = --strict-markers

testpaths =
    alirpunkto
    tests

# Live logging is opt-in (issue reported 2026-08-01): the suite
# deliberately exercises failure branches — LDAP down, unknown enum
# values, refused e-mails — whose log.error lines are the expected
# behaviour, so a green run used to shout dozens of [ERROR] lines.
# Failing tests still show their captured logs in their own report;
# re-enable the live stream on demand with: pytest -o log_cli=true
log_cli = false
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(pathname)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers = functional: smoke tests that build the full WSGI app
