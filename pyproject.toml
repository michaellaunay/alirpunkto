# Packaging metadata (external audit, 2026-08-01): every dependency used
# to be unbounded in a legacy setup.py with version='0.0' and no lock —
# two installs at different dates produced different environments.
# Bounds below are measured against the tested environment; the exact
# pinned set lives in requirements.lock (regenerate with:
#   pip install pip-tools && pip-compile --extra testing -o requirements.lock pyproject.toml
# ) and is what the CI installs.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alirpunkto"
version = "0.1.0"
description = "AlirPunkto — cooperative membership management (Pyramid/ZODB/OpenLDAP/Keycloak)"
readme = "README.txt"
requires-python = ">=3.11"
keywords = ["web", "pyramid", "pylons"]
classifiers = [
    "Programming Language :: Python",
    "Framework :: Pyramid",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "plaster_pastedeploy>=1.0.1,<2",
    "pyramid>=2.1,<3",
    "pyramid_chameleon>=0.3,<0.4",
    "pyramid_debugtoolbar>=4.12.1,<5",
    "waitress>=3.0.2,<4",
    "pyramid_retry>=2.1.1,<3",
    "pyramid_tm>=2.6,<3",
    "pyramid_zodbconn>=0.8.1,<0.9",
    "transaction>=5.1,<6",
    "ZODB>=6.3,<7",
    "pytz>=2024.1",  # calendar versioning: an upper bound would break yearly
    "deform>=3.0.1,<4",
    "pyramid_handlers>=0.5,<0.6",
    "python-dotenv>=1.2.2,<2",
    "ldap3>=2.9.1,<3",
    "pyramid_beaker>=0.9,<0.10",
    "pyramid_mailer>=0.15.1,<0.16",
    "py3dns>=4.0.2,<5",
    "PyJWT>=2.7.0,<3",
    "validate_email>=1.3,<2",
    "python-keycloak>=7.1.1,<8",
    "cryptography>=48.0.1,<49",  # >=48.0.1: GHSA-537c-gmf6-5ccf (pip-audit gate)
    "bcrypt>=5.0.0,<6",
    "requests>=2.33.1,<3",
]

[project.optional-dependencies]
testing = [
    "WebTest>=3.0.7,<4",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
]
quality = [
    # The gates .github/workflows/quality.yml runs; pinned via the lock.
    "ruff>=0.9,<1",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
    "mypy>=1.14,<2",
]

[project.entry-points."paste.app_factory"]
main = "alirpunkto:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes only, as a ratchet: real defects (unused/duplicated imports,
# undefined names) block; F841 (unused local variables) is the next
# ratchet step — 19 remain, tracked but not yet blocking.
select = ["F"]
ignore = ["F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Informative for now: 124 errors at adoption; the CI job runs it
# non-blocking (continue-on-error) until the count is driven down.
