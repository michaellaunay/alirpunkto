# =============================================================================
# docker/docker-compose.yaml — AlirPunkto full stack
#
# Run ALL commands from the REPOSITORY ROOT:
#
#   docker compose -f docker/docker-compose.yaml up -d
#   docker compose -f docker/docker-compose.yaml logs -f
#   docker compose -f docker/docker-compose.yaml down
#
# Prerequisites: run ./docker/init.sh once before the first `up`.
# =============================================================================

# All environment variables are loaded from docker/.env via --env-file at
# launch time (see README). This avoids the top-level env_file key which
# requires Docker Compose >= 2.24 and is not universally supported.
#
# IMPORTANT — path resolution: Docker Compose resolves context: and volume
# bind-mount paths relative to the location of this file (docker/).
# - context: .  → docker/          (OpenLDAP, Postfix, Apache2)
# - context: .. → repo root        (Pyramid only: needs the full source tree)
# - ./foo        → docker/foo      (files inside docker/)
# - ../foo       → repo_root/foo   (files outside docker/)
#
#   docker compose --env-file docker/.env -f docker/docker-compose.yaml up -d

services:

  # ── OpenLDAP ──────────────────────────────────────────────────────────────
  ldap:
    build:
      # context = docker/ directory (compose file location)
      context: .
      dockerfile: DockerfileOpenLDAP
      args:
        BUILD_WITH_DEBUG: ${BUILD_WITH_DEBUG:-0}
    image: alirpunkto-ldap
    container_name: alirpunkto-ldap
    restart: unless-stopped
    # Resource limits.
    # Default containers are capped at 1 GB RAM.
    # The Pyramid application is allowed up to 8 GB because it is the main
    # application workload. These values can be adjusted later using `docker stats`.
    #
    # If a container runs away, it is OOM-killed on its own and restarted,
    # instead of exhausting the host's 16 GB RAM and bringing down the whole stack.
    mem_limit: 1g
    cpus: 1.0
    # Log rotation: caps disk usage (~50 MB/container),
    # prevents an unbounded log from filling up the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # S5: block privilege escalation via setuid/setgid binaries. Safe (no
    # capability is removed) and the highest-value, lowest-risk hardening.
    security_opt:
      - no-new-privileges:true
    # S5 (enable after testing): drop all Linux capabilities, then re-add
    # only those ldap needs. Left commented because an over-tight set can
    # prevent the service from starting; validate on your stack first.
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_BIND_SERVICE
    #   - SETUID
    #   - SETGID
    #   - CHOWN
    #   - DAC_OVERRIDE
    #   - FOWNER
    networks:
      - backend
    ports:
      # S3: debug/admin from the host only. Bound to loopback so the member
      # directory (identities, {SSHA} hashes) is never exposed on the host's
      # external interfaces. The app reaches LDAP over alirpunkto-net
      # (alirpunkto-ldap:389); remote debugging goes through an SSH tunnel.
      - "127.0.0.1:8389:389"
      - "127.0.0.1:8636:636"
    environment:
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_ORGANIZATION: ${LDAP_ORGANIZATION}
      LDAP_PASSWORD_FILE: /run/secrets/ldap_password
      INITIAL_USERS_LDIF: /initials_users.generated.ldif
    secrets:
      - ldap_password
    volumes:
      - alirpunkto_ldap_etc:/etc/ldap
      - alirpunkto_ldap_var:/var/lib/ldap
      # Schema and generated LDIF — paths are relative to repo root (cwd).
      - ../alirpunkto/alirpunkto_schema.ldif:/schema/alirpunkto_schema.ldif:ro
      - ./initials_users.generated.ldif:/initials_users.generated.ldif:ro
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-s", "base", "-b", ""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Postfix ───────────────────────────────────────────────────────────────
  postfix:
    build:
      context: .
      dockerfile: DockerfilePostfix
    image: alirpunkto-postfix
    container_name: alirpunkto-postfix
    restart: unless-stopped
    # Resource limits.
    # Default containers are capped at 1 GB RAM.
    # The Pyramid application is allowed up to 8 GB because it is the main
    # application workload. These values can be adjusted later using `docker stats`.
    #
    # If a container runs away, it is OOM-killed on its own and restarted,
    # instead of exhausting the host's 16 GB RAM and bringing down the whole stack.
    mem_limit: 1g
    cpus: 1.0
    # Log rotation: caps disk usage (~50 MB/container),
    # prevents an unbounded log from filling up the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # S5: block privilege escalation via setuid/setgid binaries. Safe (no
    # capability is removed) and the highest-value, lowest-risk hardening.
    security_opt:
      - no-new-privileges:true
    # S5 (enable after testing): drop all Linux capabilities, then re-add
    # only those postfix needs. Left commented because an over-tight set can
    # prevent the service from starting; validate on your stack first.
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_BIND_SERVICE
    #   - SETUID
    #   - SETGID
    #   - CHOWN
    #   - DAC_OVERRIDE
    #   - FOWNER
    #   - DAC_READ_SEARCH
    networks:
      - backend
    # No published port: Postfix is send-only and reachable by Pyramid over the
    # internal alirpunkto-net (alirpunkto-postfix:25). Publishing 25 exposed the
    # relay to the Internet (open-relay vector) — that was the root cause of the
    # blacklisting. Only publish it if this host must be an inbound MX: then bind
    # explicitly ("<public-ip>:25:25"), add a host firewall, set POSTFIX_MYNETWORKS
    # to a tight range (or enable SASL).
    environment:
      DOMAIN: ${DOMAIN}
      POSTFIX_MYHOSTNAME: ${POSTFIX_MYHOSTNAME}
      POSTFIX_RELAYHOST: ${POSTFIX_RELAYHOST:-}
      POSTFIX_INET_PROTOCOLS: ${POSTFIX_INET_PROTOCOLS:-ipv4}
      # Relay perimeter. Left unset by default: start_postfix.sh then auto-detects
      # this container's own bridge subnet (dynamic, no hard-coded IP), which is
      # safe as long as port 25 stays unpublished. To pin an explicit perimeter,
      # set it in docker/.env, e.g.:
      #   POSTFIX_MYNETWORKS=127.0.0.0/8 [::1]/128 172.18.0.0/16
      POSTFIX_MYNETWORKS: ${POSTFIX_MYNETWORKS:-}
    volumes:
      - alirpunkto_postfix_spool:/var/spool/postfix
      - alirpunkto_postfix_dkim:/etc/dkimkeys
    healthcheck:
      # `postfix status` can return 0 even when master is not yet listening.
      # Checking for an open port 25 is more reliable.
      # R8: a bound port 25 does not prove smtpd answers. Open a real SMTP
      # connection and require the 220 greeting, so depends_on:service_healthy
      # only unblocks Pyramid once Postfix actually accepts connections.
      # ($$ escapes $ from compose variable substitution.)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/25 && read -t 3 r <&3 && case $$r in 220*) exit 0;; *) exit 1;; esac"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Pyramid ───────────────────────────────────────────────────────────────
  pyramid:
    build:
      # Must be repo root: DockerfilePyramid copies the whole project.
      context: ..
      dockerfile: docker/DockerfilePyramid
      args:
        BUILD_WITH_DEBUG: ${BUILD_WITH_DEBUG:-0}
    image: alirpunkto-pyramid
    container_name: alirpunkto-pyramid
    restart: unless-stopped
    # Resource limits.
    # Default containers are capped at 1 GB RAM.
    # The Pyramid application is allowed up to 8 GB because it is the main
    # application workload. These values can be adjusted later using `docker stats`.
    #
    # If a container runs away, it is OOM-killed on its own and restarted,
    # instead of exhausting the host's 16 GB RAM and bringing down the whole stack.
    mem_limit: 8g
    cpus: 1.0
    # Log rotation: caps disk usage (~50 MB/container),
    # prevents an unbounded log from filling up the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # S5: block privilege escalation via setuid/setgid binaries. Safe (no
    # capability is removed) and the highest-value, lowest-risk hardening.
    security_opt:
      - no-new-privileges:true
    # S5: Pyramid runs non-root (USER alirpunkto) on a high port, so it needs
    # no Linux capabilities at all.
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend
    ports:
      # S3: loopback only. Public traffic must go through Apache (80/443) for
      # TLS termination and its protections; reaching Waitress directly from
      # another host now requires an SSH tunnel.
      - "127.0.0.1:6543:6543"
    environment:
      LDAP_SERVER: alirpunkto-ldap
      LDAP_PORT: 389
      MAIL_HOST: alirpunkto-postfix
      MAIL_PORT: 25
      # Fourth audit pass (2026-08-01, P0): inside the stack Waitress must
      # bind all interfaces — Apache lives in another container, so the
      # loopback that production.ini binds for the bare host is
      # unreachable from it — and trust the Apache container's fixed
      # address (127.0.0.1 would fold the whole login throttle onto one
      # window). start_pyramid.sh turns these two variables into a
      # derived config copy via docker/apply_server_overrides.py; the
      # bare-host values in production.ini stay untouched.
      PYRAMID_LISTEN: "0.0.0.0:6543"
      PYRAMID_TRUSTED_PROXY: ${ALIRPUNKTO_APACHE_IP:-172.28.10.10}
    volumes:
      - alirpunkto_pyramid_var:/home/alirpunkto/app/var
      - ./.env:/home/alirpunkto/app/.env:ro
      # production.ini contains site-specific settings (mail, apps, org details).
      # Edit it at the repo root before first launch, then it is injected read-only.
      - ../production.ini:/home/alirpunkto/app/production.ini:ro
    depends_on:
      ldap:
        condition: service_healthy
      postfix:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6543/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Apache2 ───────────────────────────────────────────────────────────────
  apache2:
    build:
      context: .
      dockerfile: DockerfileApache2
    image: alirpunkto-apache2
    container_name: alirpunkto-apache2
    restart: unless-stopped
    # Resource limits.
    # Default containers are capped at 1 GB RAM.
    # The Pyramid application is allowed up to 8 GB because it is the main
    # application workload. These values can be adjusted later using `docker stats`.
    #
    # If a container runs away, it is OOM-killed on its own and restarted,
    # instead of exhausting the host's 16 GB RAM and bringing down the whole stack.
    mem_limit: 1g
    cpus: 1.0
    # Log rotation: caps disk usage (~50 MB/container),
    # prevents an unbounded log from filling up the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # S5: block privilege escalation via setuid/setgid binaries. Safe (no
    # capability is removed) and the highest-value, lowest-risk hardening.
    security_opt:
      - no-new-privileges:true
    # S5 (enable after testing): drop all Linux capabilities, then re-add
    # only those apache2 needs. Left commented because an over-tight set can
    # prevent the service from starting; validate on your stack first.
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_BIND_SERVICE
    #   - SETUID
    #   - SETGID
    #   - CHOWN
    #   - DAC_OVERRIDE
    #   - KILL
    networks:
      frontend:
        # Fourth audit pass (P0): Waitress trusted_proxy compares the
        # literal peer address — a service name would never match, so
        # Apache must hold a fixed IP that PYRAMID_TRUSTED_PROXY (see
        # the pyramid service) can point at. Override with
        # ALIRPUNKTO_APACHE_IP (and ALIRPUNKTO_FRONTEND_SUBNET below)
        # in docker/.env if the default subnet collides on your host.
        ipv4_address: ${ALIRPUNKTO_APACHE_IP:-172.28.10.10}
    ports:
      - "80:80"
      - "443:443"
    environment:
      APACHE_SERVER_NAME: ${APACHE_SERVER_NAME}
      APACHE_SERVER_ALIASES: ${APACHE_SERVER_ALIASES:-}
      APACHE_BACKEND_HOST: alirpunkto-pyramid
      APACHE_BACKEND_PORT: 6543
      ENABLE_CERTBOT: ${ENABLE_CERTBOT:-false}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - alirpunkto_apache_letsencrypt:/etc/letsencrypt
      - alirpunkto_apache_letsencrypt_lib:/var/lib/letsencrypt
    depends_on:
      pyramid:
        condition: service_healthy

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  alirpunkto_ldap_etc:
  alirpunkto_ldap_var:
  alirpunkto_postfix_spool:
  alirpunkto_postfix_dkim:
  alirpunkto_pyramid_var:
  alirpunkto_apache_letsencrypt:
  alirpunkto_apache_letsencrypt_lib:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # R6: split tiers. frontend carries Apache<->Pyramid; backend carries
  # Pyramid<->LDAP and Pyramid<->Postfix. Apache cannot reach LDAP/Postfix
  # and LDAP/Postfix cannot reach Apache, limiting lateral movement if one
  # public-facing service is compromised.
  frontend:
    name: alirpunkto-frontend
    driver: bridge
    # Fourth audit pass (P0): pinned subnet so apache2 can hold the fixed
    # address that PYRAMID_TRUSTED_PROXY points at. Both defaults live in
    # the same /24; override the pair in docker/.env on subnet collision.
    ipam:
      config:
        - subnet: ${ALIRPUNKTO_FRONTEND_SUBNET:-172.28.10.0/24}
  backend:
    name: alirpunkto-backend
    driver: bridge

# ── Secrets ───────────────────────────────────────────────────────────────────
# Path is relative to the working directory (repo root) when launching
# with: docker compose --env-file docker/.env -f docker/docker-compose.yaml
secrets:
  ldap_password:
    file: ./secrets/ldap_password
