###
# app configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:alirpunkto

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes = pyramid_chameleon
    pyramid_debugtoolbar
    pyramid_beaker

zodbconn.uri = file://%(here)s/var/filestorage/Data.fs?connection_cache_size=20000

retry.attempts = 3

use_forwarded_proto = true

# site_name: short name of the site (e.g. Access).
site_name = Alirpunkto
# domain_name: display name of the platform in the translated texts
# (e.g. CosmoPolitical Cooperative SCE). Not a URL, not a host.
domain_name = alirpunkto.org
# site_url: public base URL of the platform, used to build the absolute
# links of the e-mails (issue #242), e.g. https://access.cosmopolitical.coop
site_url = http://localhost:6543
organization_details = Logikascium SARl 35 rue Léon Gambetta 59273 Fretin

# Number of voters per ballot
number_of_voters=3
# Days before verifier deadline to send reminder
notice_time_verifiers=2

# Site logo
site_logo = static/alirpunkto.png
site_logo_small = static/alirpunkto-16x16.png

# Pyramid_mailer settings
mail.host = localhost
mail.port = 25
mail.username =
mail.password =
mail.tls = false
mail.ssl = false
mail.default_sender = alirpunkto@localhost

# Lists of applications shown on the home page after login (issues #35, #142).
# Every URL points directly at the SSO login entry of the application, so one
# click leads inside it. name/description/explanation are looked up in the
# translation catalogs (msgid = the English text below; untranslated languages
# fall back to it). audience: all (default) | ordinary | cooperator — the
# presentation portal carries a different description per membership type, and
# the democratic platforms only show to Cooperators. An application without a
# URL is hidden (e.g. SSO connection not implemented yet). Replace the
# placeholder logos with the real ones of your deployment.

# - collaborative workspace (NextCloud)
applications.workspace.id = workspace
applications.workspace.logo_file = static/alirpunkto.png
applications.workspace.name = Our collaborative workspace
applications.workspace.description = Where you and all members of the Community can interact, share information and work on shared documents in a completely trusted and confidential environment.
applications.workspace.url = https://workspace.cosmopolitical.coop/apps/sociallogin/custom_oidc/Keycloak
applications.workspace.audience = all

# - on-line trainings (Moodle)
applications.trainings.id = trainings
applications.trainings.logo_file = static/alirpunkto.png
applications.trainings.name = Our on-line trainings
applications.trainings.description = Where you can follow trainings provided by members of the Community, or start developing your own, in collaboration with other members of the Community if you wish.
applications.trainings.url = https://learn.cosmopolitical.coop/login/index.php
applications.trainings.explanation = Once on the training platform, click on the "CosmoPolitical login" button to enter with your account.
applications.trainings.audience = all

# - presentation portal (Drupal), Ordinary Members wording
applications.portal_ordinary.id = portal_ordinary
applications.portal_ordinary.logo_file = static/alirpunkto.png
applications.portal_ordinary.name = Our presentation portal
applications.portal_ordinary.description = Where you can make donations or purchase training materials, and track your account.
applications.portal_ordinary.url = https://www.cosmopolitical.coop/user/login
applications.portal_ordinary.audience = ordinary

# - presentation portal (Drupal), Cooperators wording
applications.portal_cooperator.id = portal_cooperator
applications.portal_cooperator.logo_file = static/alirpunkto.png
applications.portal_cooperator.name = Our presentation portal
applications.portal_cooperator.description = Where you can purchase your share(s) of the Cooperative, pay your yearly contribution, make donations, purchase training material and democratically define the quantitative parameters affecting internal processes.
applications.portal_cooperator.url = https://www.cosmopolitical.coop/user/login
applications.portal_cooperator.audience = cooperator

# - mailing lists (Sympa)
applications.mailing_lists.id = mailing_lists
applications.mailing_lists.logo_file = static/sympa.png
applications.mailing_lists.name = Our mailing lists
applications.mailing_lists.description = Where you can freely subscribe or unsubscribe to any of the mailing lists of the Cooperative open to the Community.
applications.mailing_lists.url = https://lists.cosmopolitical.coop/
applications.mailing_lists.audience = all

# - deliberative democracy platform (KuneAgi) — URL left empty until its SSO
#   connection is implemented: the entry stays hidden meanwhile.
applications.deliberative.id = deliberative
applications.deliberative.logo_file = static/alirpunkto.png
applications.deliberative.name = Our deliberative democracy platform
applications.deliberative.description = Where you and all Cooperators democratically define the Public Policies we want to implement, once elected to positions of political responsibility.
applications.deliberative.url =
applications.deliberative.audience = cooperator

# - democratic control platform (LiquidFeedback)
applications.democratic_control.id = democratic_control
applications.democratic_control.logo_file = static/alirpunkto.png
applications.democratic_control.name = Our democratic control platform
applications.democratic_control.description = Where you and all Cooperators democratically control, a priori, the most important operational decisions of the Board and of the Mediation & Arbitration Council.
applications.democratic_control.url = https://operationaldecisions.cosmopolitical.coop/index/index.html
applications.democratic_control.audience = cooperator

# By default, the toolbar only appears for clients from IP addresses
# '127.0.0.1' and '::1'.
# debugtoolbar.hosts = 127.0.0.1 ::1

[pshell]
setup = alirpunkto.pshell.setup

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
listen = localhost:6543

###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, alirpunkto

[handlers]
keys = console, file

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_alirpunkto]
level = DEBUG
handlers = file
qualname = alirpunkto
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = DEBUG
formatter = generic

[handler_file]
class = handlers.TimedRotatingFileHandler
args = ('var/log/alirpunkto.log', 'midnight', 1, 7)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(filename)s:%(lineno)s][%(threadName)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[session]
session.cookie_name = alirpunkto_session
session.cookie_max_age = 86400
session.cookie_path = /
session.cookie_domain = %(http_host)s
session.cookie_secure = true
session.cookie_httponly = true
session.timeout = 3600
