# Compose smoke test (fourth external audit pass, 2026-08-01, §6).
#
# The quality and test workflows control Python in isolation; none of
# them ever proved that the DELIVERED stack starts. The three P0
# blockers — a start script demanding the retired setup.py, a
# non-Waitress option raising ValueError before the socket binds, a
# loopback listen unreachable from the Apache container — were each
# invisible to unit tests and would each have failed this job.
#
# The job builds the real images, boots the documented compose stack
# with throwaway settings, makes one end-to-end request THROUGH Apache
# (not the published backend port), then proves the real client address
# reaches Waitress — with trusted_proxy misconfigured, the throttle log
# would show the proxy's address instead. Teardown always runs.
#
# Actions are pinned by commit SHA (mutable tags are a supply-chain
# risk); the matching tag is kept in the comment.
name: smoke

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: docker compose end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_CMD: docker compose --env-file docker/.env -f docker/docker-compose.yaml
      SERVER_NAME: smoke.alirpunkto.test
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Generate a throwaway stack configuration
        # Non-interactive mirror of docker/init.sh: docker/.env,
        # docker/secrets/ldap_password and the seeded LDIF. The three
        # user passwords go through the GENERATE_LDIF_*_PW environment
        # slots ("-" placeholders), never through argv.
        env:
          GENERATE_LDIF_ADMIN_PW: smoke-admin-password
          GENERATE_LDIF_U1_PW: smoke-user-one-password
          GENERATE_LDIF_U2_PW: smoke-user-two-password
        run: |
          set -euo pipefail
          LDAP_PASSWORD="smoke-ldap-$(python3 -c 'import secrets; print(secrets.token_hex(12))')"
          SECRET_KEY="$(python3 -c 'import secrets, base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          mkdir -p docker/secrets
          chmod 700 docker/secrets
          (umask 077; printf '%s' "${LDAP_PASSWORD}" > docker/secrets/ldap_password)
          cat > docker/.env <<EOF
          # Generated by the smoke workflow — throwaway values only.
          DOMAIN="alirpunkto.test"
          MAINTAINER_EMAIL="ci@alirpunkto.test"
          SECRET_KEY="${SECRET_KEY}"
          LDAP_SERVER="alirpunkto-ldap"
          LDAP_PORT=389
          LDAP_BASE_DN="dc=alirpunkto,dc=test"
          LDAP_ORGANIZATION="AlirPunkto CI"
          LDAP_LOGIN="cn=admin"
          LDAP_OU=""
          LDAP_PASSWORD="${LDAP_PASSWORD}"
          LDAP_USE_SSL=false
          LDAP_PASSWORD_FILE=/run/secrets/ldap_password
          APACHE_SERVER_NAME="${SERVER_NAME}"
          APACHE_SERVER_ALIASES=""
          APACHE_BACKEND_HOST=alirpunkto-pyramid
          APACHE_BACKEND_PORT=6543
          ENABLE_CERTBOT=false
          LETSENCRYPT_EMAIL=""
          POSTFIX_MYHOSTNAME="mail.alirpunkto.test"
          POSTFIX_RELAYHOST=""
          POSTFIX_INET_PROTOCOLS=ipv4
          MAIL_SERVER=alirpunkto-postfix
          MAIL_HOST=alirpunkto-postfix
          MAIL_PORT=25
          MAIL_SENDER="welcome@alirpunkto.test"
          MAIL_USERNAME=
          MAIL_PASSWORD=None
          MAIL_TLS=false
          MAIL_SSL=false
          ADMIN_LOGIN="admin"
          ADMIN_EMAIL="ci@alirpunkto.test"
          ADMIN_PASSWORD="${GENERATE_LDIF_ADMIN_PW}"
          LDAP_ADMIN_OID="00000000-0000-0000-0000-000000000000"
          KEYCLOAK_SERVER_URL=""
          KEYCLOAK_REALM=""
          KEYCLOAK_CLIENT_ID=""
          KEYCLOAK_CLIENT_SECRET=""
          EOF
          chmod 600 docker/.env
          python3 docker/generate_ldif.py \
            docker/initials_users.ldif \
            docker/initials_users.generated.ldif \
            "dc=alirpunkto,dc=test" \
            "00000000-0000-0000-0000-000000000000" \
            "admin" "smoke-admin" "ci@alirpunkto.test" "-" \
            "$(python3 -c 'import uuid; print(uuid.uuid4())')" \
            "COOPERATOR" "smoke-user-one" "Smoke" "UserOne" \
            "en" "US" "user-one@alirpunkto.test" "-" \
            "$(python3 -c 'import uuid; print(uuid.uuid4())')" \
            "ORDINARY_MEMBER" "smoke-user-two" "Smoke" "UserTwo" \
            "en" "US" "user-two@alirpunkto.test" "-" \
            "$(date -u +%Y-%m-%dT%H:%M:%S)"

      - name: Build the images
        run: ${COMPOSE_CMD} build

      - name: Install a self-signed certificate for Apache
        # The HTTPS vhost — the only one that proxies to Pyramid — is
        # wrapped in <IfFile …fullchain.pem>. ENABLE_CERTBOT stays false
        # in CI, so a throwaway certificate is written into the
        # letsencrypt volume where the vhost expects it.
        run: |
          ${COMPOSE_CMD} run --rm --no-deps --entrypoint bash apache2 -c '
            set -e
            mkdir -p "/etc/letsencrypt/live/${APACHE_SERVER_NAME}"
            openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
              -subj "/CN=${APACHE_SERVER_NAME}" \
              -keyout "/etc/letsencrypt/live/${APACHE_SERVER_NAME}/privkey.pem" \
              -out "/etc/letsencrypt/live/${APACHE_SERVER_NAME}/fullchain.pem"'

      - name: Start the stack and wait for the healthchecks
        run: ${COMPOSE_CMD} up -d --wait --wait-timeout 240

      - name: One request through Apache
        # --resolve pins SNI and Host to the vhost name on the runner's
        # loopback; -f fails the step on any HTTP error status.
        run: |
          set -euo pipefail
          curl -skf --resolve "${SERVER_NAME}:443:127.0.0.1" \
            --retry 12 --retry-delay 5 --retry-all-errors \
            -o /tmp/home.html "https://${SERVER_NAME}/"
          curl -skf --resolve "${SERVER_NAME}:443:127.0.0.1" \
            -o /tmp/login.html "https://${SERVER_NAME}/login"
          grep -q 'name="username"' /tmp/login.html

      - name: The real client address reaches Waitress
        # 5.3/5.4 of the audit: with the wrong trusted_proxy, Waitress
        # reports the proxy's address for every visitor. Eleven failed
        # logins trip the throttle, whose warning logs client_addr —
        # that address must be neither Apache's nor the loopback.
        run: |
          set -euo pipefail
          fetch=(curl -sk --resolve "${SERVER_NAME}:443:127.0.0.1" -b /tmp/jar -c /tmp/jar)
          "${fetch[@]}" -o /tmp/login.html "https://${SERVER_NAME}/login"
          token="$(grep -o 'name="csrf_token" value="[^"]*"' /tmp/login.html | head -1 | sed 's/.*value="//;s/"$//')"
          test -n "${token}"
          for _ in $(seq 1 11); do
            "${fetch[@]}" -o /dev/null \
              --data-urlencode "csrf_token=${token}" \
              --data-urlencode "form.submitted=true" \
              --data-urlencode "username=smoke-no-such-user" \
              --data-urlencode "password=wrong-password" \
              "https://${SERVER_NAME}/login"
          done
          log="$(${COMPOSE_CMD} exec -T pyramid cat /home/alirpunkto/app/var/log/alirpunkto.log)"
          line="$(printf '%s\n' "${log}" | grep 'login throttled for ip=' | tail -1)"
          echo "throttle line: ${line}"
          ip="$(printf '%s\n' "${line}" | sed 's/.*ip=\([^ ]*\).*/\1/')"
          apache_ips="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' alirpunkto-apache2)"
          echo "client_addr=${ip} apache=${apache_ips}"
          test -n "${ip}"
          test "${ip}" != "127.0.0.1"
          case " ${apache_ips} " in
            *" ${ip} "*) echo "client_addr is the proxy address — trusted_proxy is wrong"; exit 1;;
          esac

      - name: Compose diagnostics
        if: failure()
        run: |
          ${COMPOSE_CMD} ps || true
          ${COMPOSE_CMD} logs --no-color --tail 200 || true

      - name: Tear the stack down
        if: always()
        run: ${COMPOSE_CMD} down -v --remove-orphans
