# Quality gates (external audit, 2026-08-01). Actions are pinned by
# commit SHA (revised audit: mutable tags are a supply-chain risk);
# the tag each SHA corresponds to is kept in the comment.
name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (pyflakes, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-quality.lock
      - run: ruff check alirpunkto tests tools docker/apply_server_overrides.py docker/generate_ldif.py

  security:
    name: bandit + pip-audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-quality.lock
      - name: bandit (medium severity and above)
        run: bandit -r alirpunkto tools -ll -q
      - name: pip-audit on the lock
        # PYSEC-2026-3447 (setuptools): the deform chain pins the
        # transitive setuptools below the fixed release; the CVE
        # concerns package-installation paths, not runtime. Documented
        # accepted risk — drop the ignore when the chain lifts.
        # Fourth audit pass (P1): audit all three hashed locks — the
        # runtime lock is what ships; the other two are what the CI runs.
        run: >-
          pip-audit --no-deps --ignore-vuln PYSEC-2026-3447
          -r requirements.lock
          -r requirements-test.lock
          -r requirements-quality.lock

  typing:
    name: mypy (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-quality.lock
      - run: pip install -e . --no-deps
      - run: mypy alirpunkto

  secrets:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Scan the whole history, not just the tip: a secret committed
          # then deleted is still in every clone.
          fetch-depth: 0
      # Fourth audit pass (2026-08-01, §6): scan for committed secrets.
      # Free for personal repositories; organisations need a
      # GITLEAKS_LICENSE secret (see the gitleaks-action README).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
