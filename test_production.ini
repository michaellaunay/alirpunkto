###
# app configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
#
# kuneagi02 (testalirpunkto.cosmopolitical.coop) — updated 2026-08-03
# to the ca620dcd repository state, keeping this server's particulars:
# site identity, mail relay, the six SSO application entries (migrated
# to the translated audience-aware contract of issues #35/#142), the
# historical ZODB path var/datas/, and the deliberate DEBUG logging of
# a test server. New here: the Waitress proxy-trust block (the login
# rate limit needs the real client address), notice_time_verifiers,
# and the welcome@ sender of issue #69.
###

[app:main]
use = egg:alirpunkto

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes = pyramid_chameleon

# This server's historical data file (a fresh install would use
# var/filestorage/ — do not move existing data).
zodbconn.uri = file://%(here)s/var/datas/Data.fs?connection_cache_size=20000

retry.attempts = 3
verifier_reminder_min_interval_seconds = 180

site_name = Access
site_url = https://testalirpunkto.cosmopolitical.coop
domain_name = CosmoPolitical Cooperative SCE
# Pyramid_mailer settings
mail.host = alirpunkto-postfix
mail.port = 25
mail.username =
mail.password =
mail.tls = false
mail.ssl = false
# From address of every outgoing e-mail (issue #69): never a person.
# The MAIL_SENDER environment variable wins over this value; if both
# are empty, welcome@<domain_name> is used. Previously
# admin@access.cosmopolitical.coop on this server.
mail.default_sender = welcome@access.cosmopolitical.coop

# Number of voters per ballot
number_of_voters=3

# Delay (in days) before verifiers are reminded of a pending vote
notice_time_verifiers=2

# Site logo (kept commented on this server — application defaults)
#site_logo = static/logo_cosmopolitical.png
#site_logo_small = static/alirpunkto-16x16.png

# email signature
organization_details = CosmoPolitical Cooperative SCE, European Cooperative Society (SCE) with a starting capital of EUR 30 000, registered in France under the number: 951 007 897 R.C.S. Lille Métropole.  Postal address: 229 rue Solférino, 59000 Lille, France

# Lists of applications shown on the home page after login (issues
# #35, #142). Every URL points directly at the SSO login entry of the
# application, so one click leads inside it. name/description/
# explanation are looked up in the translation catalogs (msgid = the
# identifiers below; untranslated languages fall back to English).
# audience: all (default) | ordinary | cooperator — the presentation
# portal carries a different description per membership type, and the
# democratic platforms only show to Cooperators. An application
# without a URL is hidden. The logo files below are this server's
# local ones — keep them present in static/.

# - collaborative workspace (NextCloud)
applications.workspace.id = workspace
applications.workspace.logo_file = static/workspace.png
applications.workspace.name = application_workspace_name
applications.workspace.description = application_workspace_description
applications.workspace.url = https://workspace.cosmopolitical.coop/apps/sociallogin/custom_oidc/Keycloak
applications.workspace.audience = all

# - on-line trainings (Moodle)
applications.trainings.id = trainings
applications.trainings.logo_file = static/learn.png
applications.trainings.name = application_trainings_name
applications.trainings.description = application_trainings_description
applications.trainings.url = https://learn.cosmopolitical.coop/login/index.php
applications.trainings.explanation = application_trainings_note
applications.trainings.audience = all

# - presentation portal (Drupal), Ordinary Members wording
applications.portal_ordinary.id = portal_ordinary
applications.portal_ordinary.logo_file = static/presentation.png
applications.portal_ordinary.name = application_portal_name
applications.portal_ordinary.description = application_portal_ordinary_description
applications.portal_ordinary.url = https://www.cosmopolitical.coop/user/login
applications.portal_ordinary.audience = ordinary

# - presentation portal (Drupal), Cooperators wording
applications.portal_cooperator.id = portal_cooperator
applications.portal_cooperator.logo_file = static/presentation.png
applications.portal_cooperator.name = application_portal_name
applications.portal_cooperator.description = application_portal_cooperator_description
applications.portal_cooperator.url = https://www.cosmopolitical.coop/user/login
applications.portal_cooperator.audience = cooperator

# - mailing lists (Sympa) — this server keeps its direct CAS SSO entry
applications.mailing_lists.id = mailing_lists
applications.mailing_lists.logo_file = static/mailinglists.png
applications.mailing_lists.name = application_mailing_lists_name
applications.mailing_lists.description = application_mailing_lists_description
applications.mailing_lists.url = https://authentication.cosmopolitical.coop/realms/cosmopolitical-login/protocol/cas/login?service=https://lists.cosmopolitical.coop/sympa/sso_login_succeeded/CosmoPolitical_login
applications.mailing_lists.audience = all

# - deliberative democracy platform (KuneAgi) — kept VISIBLE on this
#   server (historical choice); the reference hides it (empty url)
#   until its SSO connection is implemented. Empty the url to hide it.
applications.deliberative.id = deliberative
applications.deliberative.logo_file = static/deliberative_democracy.png
applications.deliberative.name = application_deliberative_name
applications.deliberative.description = application_deliberative_description
applications.deliberative.url = https://publicpolicies.cosmopolitical.coop
applications.deliberative.audience = cooperator

# - democratic control platform (LiquidFeedback)
applications.democratic_control.id = democratic_control
applications.democratic_control.logo_file = static/democratic_control.png
applications.democratic_control.name = application_democratic_control_name
applications.democratic_control.description = application_democratic_control_description
applications.democratic_control.url = https://operationaldecisions.cosmopolitical.coop/index/index.html
applications.democratic_control.audience = cooperator

[pshell]
setup = alirpunkto.pshell.setup

###
# wsgi server configuration
###

[server:main]
# Waitress only reads its options here — the revised audit caught these
# living in [app:main], where they were inert. The login rate limit
# counts attempts per client IP: behind Apache, Waitress must trust the
# proxy or every request carries 127.0.0.1 and the IP window would
# throttle everyone together.
# Fourth audit pass (2026-08-01): use_forwarded_proto is NOT a Waitress
# option — Waitress 3 refuses unknown adjustments with a ValueError
# before the socket even binds; url_scheme below already fixes the
# scheme. The values here are the bare-host deployment (doc chapter
# 13). The Docker stack must NOT edit this file: docker-compose.yaml
# sets PYRAMID_LISTEN / PYRAMID_TRUSTED_PROXY and start_pyramid.sh
# derives a container-local copy through
# docker/apply_server_overrides.py (inside the stack Waitress must bind
# 0.0.0.0 and trust the Apache container's fixed address).
trusted_proxy = 127.0.0.1
trusted_proxy_headers = x-forwarded-for
clear_untrusted_proxy_headers = true
use = egg:waitress#main
# Apache proxies locally on this host: no reason to expose Waitress
# beyond loopback (previously 0.0.0.0:6543 here).
listen = localhost:6543
url_scheme = https

###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, alirpunkto

[handlers]
keys = console, file

[formatters]
keys = generic

# Test server: DEBUG kept deliberately (the repository reference ships
# WARN) — the encrypted DEBUG password traces exist for this usage.
[logger_root]
level = DEBUG
handlers = console

[logger_alirpunkto]
level = DEBUG
handlers = file
qualname = alirpunkto
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file]
class = handlers.TimedRotatingFileHandler
args = ('var/log/alirpunkto.log', 'midnight', 1, 7)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[session]
session.cookie_name = alirpunkto_session
session.cookie_max_age = 86400
session.cookie_path = /
session.cookie_domain = %(http_host)s
session.cookie_secure = true
session.cookie_httponly = true
session.timeout = 3600
